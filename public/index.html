<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#172b49;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:24px 12px}.wrap{max-width:520px;margin:auto;background:white;border-radius:18px;box-shadow:0 8px 30px #15345718;overflow:hidden}.head{background:#123d75;color:white;text-align:center;padding:28px 20px}.head .icon{font-size:30px;margin-bottom:10px}.head h1{font-size:21px;margin:0 0 8px}.head p{font-size:13px;margin:0;opacity:.9}.body{padding:25px}label{display:block;font-weight:700;font-size:13px;margin:0 0 8px}input{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:13px;font:inherit;background:#fff;color:#172b49}input:focus{outline:2px solid #7baeea;border-color:#3474bd}.field{margin-bottom:19px}.upload{border:2px dashed #a9bdd7;border-radius:12px;padding:20px;text-align:center;background:#f7faff}.upload input{border:0;padding:8px 0;font-size:13px;max-width:100%}.hint{font-size:12px;color:#64748b;margin:8px 0 0}.btn{border:0;border-radius:10px;background:#14539c;color:white;font-size:15px;font-weight:700;padding:15px 18px;width:100%;cursor:pointer;margin-top:22px}.btn:disabled{opacity:.55;cursor:wait}.error{color:#9f1239;background:#fff1f2;border-radius:8px;padding:12px;margin-top:14px;display:none;font-size:13px}.success{text-align:center}.tick{font-size:54px;color:#16803c}.success h2{font-size:22px}.summary{background:#f4f7fb;border-radius:12px;padding:16px;text-align:left;margin-top:22px}.item{padding:10px 0;border-bottom:1px solid #e2e8f0;overflow-wrap:anywhere}.item:last-child{border-bottom:0}.key{display:block;color:#64748b;font-size:12px;margin-bottom:5px}.value{font-weight:700;font-size:14px}.hidden{display:none}.footer{color:#64748b;font-size:11px;text-align:center;margin-top:22px;line-height:1.5}
</style></head><body><main class="wrap"><header class="head"><div class="icon">▣</div><h1>Envio de Termo de Imagem</h1><p>Igreja Universal do Reino de Deus</p></header><section class="body"><div id="page-form"><form id="termForm"><div class="field"><label for="nome">Nome da pessoa que deu o testemunho</label><input id="nome" name="nome" maxlength="180" required placeholder="Nome completo"></div><div class="field"><label for="igreja">Igreja</label><input id="igreja" name="igreja" maxlength="180" required placeholder="Nome da igreja ou unidade"></div><div class="field"><label for="data">Data do envio</label><input type="date" id="data" name="data" required></div><div class="field"><label for="responsavel">Nome do responsável pelo envio</label><input id="responsavel" name="responsavel" maxlength="180" required placeholder="Nome completo"></div><div class="upload"><label for="arquivo">Anexar termo de uso de imagem</label><input id="arquivo" type="file" name="arquivo" accept=".pdf,.jpg,.jpeg,application/pdf,image/jpeg" required><p class="hint">PDF ou JPG • máximo de 10 MB</p></div><div class="error" id="error" role="alert"></div><button class="btn" id="send" type="submit">Enviar termo</button></form></div><div id="page-success" class="hidden success"><div class="tick">✓</div><h2>Envio confirmado!</h2><p>O arquivo foi armazenado com sucesso.</p><div id="summary" class="summary"></div><button id="again" class="btn">Enviar novo arquivo</button></div><p class="footer">Envie apenas documentos autorizados. O arquivo será armazenado em uma pasta privada da equipe responsável.</p></section></main><script>
const form=document.getElementById('termForm'),send=document.getElementById('send'),error=document.getElementById('error'),date=document.getElementById('data');
function today(){const d=new Date(),local=new Date(d.getTime()-d.getTimezoneOffset()*60000);return local.toISOString().slice(0,10)}date.value=today();
function showError(msg){error.textContent=msg;error.style.display='block';send.disabled=false;send.textContent='Enviar termo'}
form.addEventListener('submit',e=>{e.preventDefault();error.style.display='none';const file=document.getElementById('arquivo').files[0];if(!file)return showError('Selecione um arquivo.');if(file.size>10*1024*1024)return showError('O arquivo deve ter no máximo 10 MB.');if(!/\.(pdf|jpe?g)$/i.test(file.name))return showError('Use PDF ou JPG.');send.disabled=true;send.textContent='Enviando...';fetch('/api/enviar',{method:'POST',body:new FormData(form)}).then(async response=>{const result=await response.json();if(!response.ok)throw new Error(result.error||'Falha no envio.');return result}).then(result=>{const fields=[['Pessoa',result.nome],['Igreja',result.igreja],['Data',result.data.split('-').reverse().join('/')],['Responsável',result.responsavel],['Arquivo',result.arquivo],['Protocolo',result.protocolo]];const summary=document.getElementById('summary');summary.replaceChildren();fields.forEach(([key,value])=>{const item=document.createElement('div');item.className='item';const k=document.createElement('span');k.className='key';k.textContent=key;const v=document.createElement('span');v.className='value';v.textContent=value;item.append(k,v);summary.append(item)});document.getElementById('page-form').classList.add('hidden');document.getElementById('page-success').classList.remove('hidden');send.disabled=false;send.textContent='Enviar termo';window.scrollTo(0,0)}).catch(err=>showError(err.message||'Falha no envio. Tente novamente.'))});
document.getElementById('again').addEventListener('click',()=>{form.reset();date.value=today();error.style.display='none';document.getElementById('page-success').classList.add('hidden');document.getElementById('page-form').classList.remove('hidden');window.scrollTo(0,0)});
</script></body></html>
